name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    # 宿主守卫：只在 GitHub 执行——gitea 的 runner 也认 .github/workflows/，
    # 内网推 tag 会误触发（无 GitHub 环境，纯浪费 runner）。gitea 的
    # github.server_url 是自身地址，恒不等于 GitHub
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@v4
      # 集市发布打包：ubuntu 自带 zip，直接组装（不动 node_modules，
      # 与本地 pack.mjs 无关——那是手动测试用的，CI 不需要触发）
      - name: Build package.zip
        run: |
          mkdir -p pkg/colorful-doc-tree
          cp plugin.json index.js index.css icon.png preview.png README.md README.zh-CN.md pkg/colorful-doc-tree/
          cp -r i18n pkg/colorful-doc-tree/
          cd pkg && zip -r ../package.zip colorful-doc-tree
      - uses: softprops/action-gh-release@v2
        with:
          files: package.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
