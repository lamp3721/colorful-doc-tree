name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    # 宿主守卫：只在 GitHub 执行——gitea 的 runner 也认 .github/workflows/，
    # 内网推 tag 会误触发（无 GitHub 环境，纯浪费 runner）。gitea 的
    # github.server_url 是自身地址，恒不等于 GitHub
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@v4
      - name: Build package.zip（与本地同命令——单一打包事实源）
        run: |
          npm install --no-audit --no-fund
          npm run pack
      - uses: softprops/action-gh-release@v2
        with:
          files: package.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
